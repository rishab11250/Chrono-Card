name: Verify Chrono Card
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - run: npm run docs:pdf
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            docs/chrono-card-submission.pdf
            test-results/
