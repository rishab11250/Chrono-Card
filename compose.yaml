services:
  game:
    build: .
    ports: ['3001:3001']
    environment:
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3001
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
    volumes: ['scores:/app/data']
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['rooms:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  scores:
  rooms:
